<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Heart Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden; touch-action: none;
  }
  #gameWrapper {
    position: relative; width: 100%; max-width: 800px; margin: 0 auto;
  }
  #topBar {
    display: none; justify-content: space-between; align-items: center;
    padding: 5px 10px; background: #050510;
    border-bottom: 2px solid #00ffcc;
  }
  #topBar.visible { display: flex; }
  .hud-text {
    color: #00ffcc; font-size: 13px; letter-spacing: 2px;
    text-shadow: 0 0 8px #00ffcc;
  }
  #toggleBtn {
    background: #050510; border: 2px solid #00ffcc; color: #00ffcc;
    font-family: 'Courier New', monospace; font-size: 11px;
    padding: 3px 9px; cursor: pointer; letter-spacing: 1px;
    text-shadow: 0 0 6px #00ffcc;
  }
  #toggleBtn:hover { background: #00ffcc; color: #000; }
  canvas {
    display: block; width: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: pointer;
  }

  /* ── POPUP ── */
  #popup {
    display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.88); z-index: 100;
    align-items: center; justify-content: center; padding: 14px;
  }
  #popup.show { display: flex; }
  #popupBox {
    background: #05050f;
    border: 3px solid #00ffcc;
    box-shadow: 0 0 30px #00ffcc44, inset 0 0 40px rgba(0,255,204,0.04);
    max-width: 520px; width: 100%; padding: 0; overflow: hidden;
    position: relative;
  }
  #popupHeader {
    background: #0a0a20; border-bottom: 2px solid #00ffcc44;
    padding: 14px 18px; display: flex; align-items: center; gap: 14px;
  }
  #popupHeartIcon {
    font-size: 36px; line-height: 1;
    text-shadow: 0 0 16px #ff4488, 0 0 32px #ff4488;
    animation: heartbeat 1s infinite;
    flex-shrink: 0;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15%      { transform: scale(1.18); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.10); }
  }
  #popupTitleWrap { flex: 1; }
  #popupTitle {
    color: #ffee44; font-size: 15px; font-weight: bold; letter-spacing: 3px;
    text-transform: uppercase; text-shadow: 0 0 10px #ffee44;
    margin-bottom: 3px;
  }
  #popupSubtitle { color: #00ffcc; font-size: 10px; letter-spacing: 2px; text-shadow: 0 0 6px #00ffcc; }
  #popupBody { padding: 14px 18px; }
  #popupIntro {
    color: #ff88bb; font-size: 12px; line-height: 1.7; margin-bottom: 12px;
    font-style: italic; border-left: 3px solid #ff4488; padding-left: 10px;
  }
  #popupDesc { color: #aaddff; font-size: 11px; line-height: 1.75; margin-bottom: 12px; }
  #popupCite {
    color: #556677; font-size: 10px; line-height: 1.6;
    border-top: 1px solid #1a2a3a; padding-top: 8px; margin-bottom: 14px;
  }
  #popupCite a { color: #00ffcc; text-decoration: none; }
  #popupCite a:hover { text-decoration: underline; }
  #popupContinue {
    display: block; width: 100%;
    background: #00ffcc; color: #000;
    border: none; font-family: 'Courier New', monospace;
    font-size: 13px; font-weight: bold; padding: 11px;
    cursor: pointer; letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 0 20px #00ffcc66;
  }
  #popupContinue:hover { background: #ffee44; box-shadow: 0 0 20px #ffee4466; }

  /* Mobile controls */
  #mobileControls {
    display: none; position: absolute; bottom: 8px; left: 0; right: 0;
    justify-content: space-between; padding: 0 12px;
    pointer-events: none; z-index: 20;
  }
  .ctrl-group { display: flex; gap: 6px; pointer-events: all; }
  .ctrl-btn {
    width: 50px; height: 50px;
    background: rgba(0,255,204,0.12); border: 2px solid #00ffcc;
    color: #00ffcc; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none; text-shadow: 0 0 6px #00ffcc;
    box-shadow: 0 0 8px #00ffcc44;
  }
  .ctrl-btn:active { background: rgba(0,255,204,0.4); }
  @media (pointer: coarse) { #mobileControls { display: flex; } }
  @media (max-width: 600px) { .hud-text { font-size: 10px; } }
</style>
</head>
<body>
<div id="gameWrapper">
  <div id="topBar">
    <span class="hud-text" id="hudLevel">LVL 1</span>
    <span class="hud-text" id="hudScore">SCORE: 0</span>
    <button id="toggleBtn">☀ DAY</button>
    <span class="hud-text" id="hudHP">❤❤❤</span>
  </div>
  <canvas id="gameCanvas"></canvas>

  <div id="popup">
    <div id="popupBox">
      <div id="popupHeader">
        <div id="popupHeartIcon">♥</div>
        <div id="popupTitleWrap">
          <div id="popupTitle"></div>
          <div id="popupSubtitle">GUARDIAN DEFEATED — HEART RESTORED!</div>
        </div>
      </div>
      <div id="popupBody">
        <div id="popupIntro"></div>
        <div id="popupDesc"></div>
        <div id="popupCite"></div>
        <button id="popupContinue">CONTINUE ▶</button>
      </div>
    </div>
  </div>

  <div id="mobileControls">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btnLeft">◀</div>
      <div class="ctrl-btn" id="btnRight">▶</div>
      <div class="ctrl-btn" id="btnJump">▲</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btnZap">⚡</div>
    </div>
  </div>
</div>

<script>
// ── DISEASE DATA ──────────────────────────────────────────────────────────────
const DISEASES = [
  {
    name: "ARRHYTHMIA",
    bodyColor: '#cc2222', darkColor: '#881111', wingColor: '#aa1111', eyeColor: '#ff6666',
    intro: "Oh, thank you, brave Wizard! I am finally free. For so long I was tormented by Arrhythmia — my rhythm was all wrong, beating too fast, too slow, completely out of control. I couldn't live properly. You've restored my steady beat!",
    desc: "Arrhythmia is an irregular heartbeat caused by faulty electrical signals in the heart. Types include atrial fibrillation (AFib), ventricular fibrillation, and supraventricular tachycardia (SVT). It can range from harmless to life-threatening, potentially causing stroke or cardiac arrest. Symptoms include palpitations, dizziness, shortness of breath, or chest pain.",
    cite: "American Heart Association. (2023). <em>About Arrhythmia</em>. American Heart Association.",
    link: "https://www.heart.org/en/health-topics/arrhythmia/about-arrhythmia"
  },
  {
    name: "CORONARY ARTERY DISEASE",
    bodyColor: '#cc5500', darkColor: '#883300', wingColor: '#aa4400', eyeColor: '#ffaa44',
    intro: "Bless you, Wizard! My arteries were so clogged I could barely breathe. Coronary Artery Disease had turned my vessels to stone — plaque everywhere, blocking every drop of blood I needed. You've cleared the way and I can flow freely again!",
    desc: "Coronary artery disease (CAD) occurs when plaque builds up inside the coronary arteries (atherosclerosis), narrowing them and reducing blood flow to the heart. This can cause chest pain (angina), shortness of breath, or a heart attack. CAD is the leading cause of death for men and women in the United States. Risk factors include smoking, high cholesterol, hypertension, diabetes, and family history.",
    cite: "Centers for Disease Control and Prevention. (2023). <em>Coronary Artery Disease</em>. CDC.",
    link: "https://www.cdc.gov/heartdisease/coronary_ad.htm"
  },
  {
    name: "HEART FAILURE",
    bodyColor: '#7722cc', darkColor: '#441188', wingColor: '#5511aa', eyeColor: '#cc88ff',
    intro: "I owe you everything, Wizard! Heart Failure had left me so weak — I couldn't pump, couldn't keep up, couldn't give the body what it needed. Fluid was building up everywhere. I had almost given up hope. You gave me strength again!",
    desc: "Heart failure occurs when the heart muscle cannot pump blood effectively. Blood backs up, causing fluid to build up in the lungs and limbs, leading to breathlessness, fatigue, and swelling. It affects ~6.2 million adults in the U.S. It is commonly caused by coronary artery disease or high blood pressure. While not curable, it is manageable with medications, lifestyle changes, and sometimes devices or surgery.",
    cite: "Mayo Clinic. (2023). <em>Heart Failure — Symptoms and Causes</em>. Mayo Clinic.",
    link: "https://www.mayoclinic.org/diseases-conditions/heart-failure/symptoms-causes/syc-20373142"
  },
  {
    name: "HYPERTENSION",
    bodyColor: '#bb1166', darkColor: '#880044', wingColor: '#991155', eyeColor: '#ff88bb',
    intro: "Thank you, Wizard! The pressure — oh, the endless pressure. Hypertension had me squeezing so hard against my own walls that I thought I would burst. Nobody even noticed because there were no visible signs. You saw through the silence and saved me!",
    desc: "Hypertension (high blood pressure) is called the 'silent killer' because it usually has no symptoms, yet it quietly damages arteries and the heart over time. A reading of 130/80 mmHg or higher is considered hypertension. It affects nearly half of U.S. adults and is a major risk factor for heart attack, stroke, and kidney disease. It is managed through lifestyle changes and medication.",
    cite: "World Health Organization. (2023). <em>Hypertension — Key Facts</em>. WHO.",
    link: "https://www.who.int/news-room/fact-sheets/detail/hypertension"
  },
  {
    name: "VALVULAR DISEASE",
    bodyColor: '#117755', darkColor: '#0a4433', wingColor: '#0e6644', eyeColor: '#44ffbb',
    intro: "You've done it, Wizard! My valves were broken — some sealed shut, some flapping uselessly open, unable to hold back or let through what needed to flow. Valvular Disease had turned my doors into rubble. Now they open and close as they should. I'm whole again!",
    desc: "Valvular heart disease occurs when one or more of the heart's four valves — mitral, tricuspid, pulmonary, or aortic — fail to open or close properly. Valves may be stenotic (too narrow) or regurgitant (leaky), disrupting blood flow. Causes include age-related changes, congenital defects, and rheumatic fever. Treatment ranges from monitoring to surgical valve repair or replacement.",
    cite: "National Heart, Lung, and Blood Institute. (2022). <em>Heart Valve Disease</em>. NHLBI.",
    link: "https://www.nhlbi.nih.gov/health/heart-valve-disease"
  }
];

// ── LEVEL DIFFICULTY CONFIG ───────────────────────────────────────────────────
const LEVEL_CONFIG = [
  // Lvl 1: Walk only
  { moveSpeed:0.55, fireCooldown:0,   fireCount:0, fireSpeed:0,   hasCharge:false, chargeCooldown:0,   hasShock:false, shockCooldown:0   },
  // Lvl 2: Slow aimed fireball
  { moveSpeed:0.90, fireCooldown:180, fireCount:1, fireSpeed:3.8, hasCharge:false, chargeCooldown:0,   hasShock:false, shockCooldown:0   },
  // Lvl 3: Two spread fireballs, faster movement
  { moveSpeed:1.25, fireCooldown:120, fireCount:2, fireSpeed:5.2, hasCharge:false, chargeCooldown:0,   hasShock:false, shockCooldown:0   },
  // Lvl 4: Two fireballs + dash charge
  { moveSpeed:1.55, fireCooldown:95,  fireCount:2, fireSpeed:6.2, hasCharge:true,  chargeCooldown:300, hasShock:false, shockCooldown:0   },
  // Lvl 5: Three fireballs + charge + ground shockwave
  { moveSpeed:1.90, fireCooldown:65,  fireCount:3, fireSpeed:7.5, hasCharge:true,  chargeCooldown:220, hasShock:true,  shockCooldown:200 },
];

// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 800, H = 450;
canvas.width = W; canvas.height = H;
const GROUND_Y = Math.floor(H * 0.70);

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = 'title'; // title|playing|enemySmoke|heartReveal|gameover|win
let isNight = false, score = 0, level = 1, wizardHP = 3, frame = 0, sceneTimer = 0;

// ── INPUT ─────────────────────────────────────────────────────────────────────
const keys = { left:false, right:false, jump:false };
let zapPressed = false;

document.addEventListener('keydown', e => {
  if (e.code==='ArrowLeft')  keys.left  = true;
  if (e.code==='ArrowRight') keys.right = true;
  if (e.code==='ArrowUp')    keys.jump  = true;
  if (e.code==='Space') { e.preventDefault(); zapPressed = true; }
});
document.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft')  keys.left  = false;
  if (e.code==='ArrowRight') keys.right = false;
  if (e.code==='ArrowUp')    keys.jump  = false;
});
canvas.addEventListener('click', () => { if (state==='title') startGame(); });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state==='title') startGame();
  else if (state==='playing') zapPressed = true;
}, { passive:false });

function setupBtn(id, key) {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key]=true; if(key==='zap')zapPressed=true; }, {passive:false});
  el.addEventListener('touchend',   e => { e.preventDefault(); keys[key]=false; }, {passive:false});
  el.addEventListener('mousedown',  () => { keys[key]=true;  if(key==='zap')zapPressed=true; });
  el.addEventListener('mouseup',    () => { keys[key]=false; });
}
setupBtn('btnLeft','left'); setupBtn('btnRight','right');
setupBtn('btnJump','jump'); setupBtn('btnZap','zap');

document.getElementById('toggleBtn').addEventListener('click', () => {
  isNight = !isNight;
  document.getElementById('toggleBtn').textContent = isNight ? '☽ NIGHT' : '☀ DAY';
});
document.getElementById('popupContinue').addEventListener('click', continueAfterPopup);

// ── PIXEL HELPER ─────────────────────────────────────────────────────────────
function px(x, y, w, h, c) { ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

// ── BACKGROUND (TRONGLETS VIBE) ───────────────────────────────────────────────
let bgOff = 0;
const CLOUDS = [{x:60,y:48,s:.5},{x:250,y:34,s:.3},{x:440,y:56,s:.5},{x:620,y:40,s:.3},{x:760,y:50,s:.4}];

function drawBg() {
  // Sky — bright blue by day, near-black by night
  const skyT = isNight ? '#010108' : '#3a7abf';
  const skyB = isNight ? '#050518' : '#89c4f0';
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
  g.addColorStop(0, skyT); g.addColorStop(1, skyB);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,GROUND_Y);

  // Stars — night only
  if (isNight) {
    const STARS = [
      [40,18],[120,10],[200,30],[310,8],[380,22],[460,14],[550,28],[630,10],[720,20],[760,35],
      [80,45],[170,50],[260,40],[340,55],[500,42],[680,48],[150,16],[430,34],[590,16],[700,38],
      [55,62],[300,25],[490,60],[640,30],[770,55],[100,72],[360,68],[520,72],[660,65],[740,78]
    ];
    for (const [sx,sy] of STARS) {
      const twinkle = Math.floor(frame/25+sx*0.1)%4 === 0;
      ctx.fillStyle = twinkle ? '#aabbee' : '#6677aa';
      ctx.fillRect(sx,sy,2,2);
    }
  }

  // Sun / moon — neon glow style
  if (!isNight) drawNeonSun(680,55); else drawNeonMoon(680,55);

  // Clouds — dark tinted
  bgOff += 0.35;
  for (const c of CLOUDS) {
    const cx = ((c.x - bgOff*c.s + W*4) % (W+120)) - 60;
    drawCloud(cx, c.y);
  }

  // Castles
  drawCastles(bgOff * 0.13);

  // Ground — dark pixelated grass
  drawGrass();

}

function drawNeonSun(cx, cy) {
  // Soft glow halo
  ctx.fillStyle='rgba(255,220,80,0.18)';
  ctx.beginPath(); ctx.arc(cx,cy,46,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,220,80,0.10)';
  ctx.beginPath(); ctx.arc(cx,cy,58,0,Math.PI*2); ctx.fill();
  // Pixel rays
  const dirs=[[-22,-3,8,6],[14,-3,8,6],[-3,-22,6,8],[-3,14,6,8],[-18,-18,8,6],[10,-18,8,6],[-18,10,8,6],[10,10,8,6]];
  for(const[dx,dy,rw,rh]of dirs) px(cx+dx,cy+dy,rw,rh,'#ffcc00');
  // Sun body — bright yellow rows
  const rows=[[-12,-12,24,4],[-16,-8,32,4],[-18,-4,36,4],[-18,0,36,4],[-16,4,32,4],[-12,8,24,4]];
  for(const[dx,dy,rw,rh]of rows) px(cx+dx,cy+dy,rw,rh,'#ffe033');
  // Bright center
  px(cx-8,cy-8,16,16,'#fff5aa');
  px(cx-4,cy-4,8,8,'#ffffff');
}

function drawNeonMoon(cx, cy) {
  ctx.fillStyle='rgba(100,150,255,0.08)';
  ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2); ctx.fill();
  const rows=[[-10,-10,20,4],[-14,-6,28,4],[-16,-2,32,4],[-14,2,28,4],[-10,6,20,4]];
  for(const[dx,dy,rw,rh]of rows) px(cx+dx,cy+dy,rw,rh,'#334466');
  px(cx-8,cy-4,6,4,'#223355'); px(cx+4,cy+2,8,4,'#223355');
  ctx.fillStyle='rgba(80,120,255,0.12)';
  ctx.beginPath(); ctx.arc(cx,cy,22,0,Math.PI*2); ctx.fill();
}

function drawCloud(cx, cy) {
  const c = isNight ? '#0e0e22' : '#f0f4ff';
  const s = isNight ? '#09091a' : '#c8d4ee';
  px(cx+14,cy,   20,6,s);
  px(cx+14,cy-6, 20,6,c);
  px(cx+6, cy-4, 40,8,c);
  px(cx,   cy+2, 52,6,c);
  px(cx+24,cy-12,14,6,c);
}

// ── PIXEL CASTLE ─────────────────────────────────────────────────────────────
const CASTLE_DEFS = [{bx:40,w:100},{bx:235,w:82},{bx:395,w:118},{bx:585,w:92},{bx:732,w:104}];

function drawCastles(off) {
  for (const d of CASTLE_DEFS) {
    const x = ((d.bx - off + W*3) % (W+220)) - 110;
    drawPixelCastle(x|0, GROUND_Y, d.w);
  }
}

function drawPixelCastle(bx, groundY, w) {
  // Stone tones — readable in both day and night
  const S1= isNight ? '#1a1a2e' : '#8a8fa8';
  const S2= isNight ? '#141424' : '#72778e';
  const SD= isNight ? '#0a0a18' : '#4a4e62';
  const SH= isNight ? '#222240' : '#aaafc8';
  const winC = isNight ? '#00ffcc33' : '#ffe88866';
  const flagC = '#dd2222';

  const keepW = Math.floor(w*0.50), keepH = Math.floor(w*1.05);
  const keepX = bx + Math.floor((w-keepW)/2), keepY = groundY-keepH;
  const wallH  = Math.floor(w*0.52), wallY = groundY-wallH;
  const twW = Math.floor(w*0.23), twH = Math.floor(w*0.72), twY = groundY-twH;

  // Curtain wall
  px(bx+twW, wallY, w-twW*2, wallH, S2);
  drawBricks(bx+twW, wallY, w-twW*2, wallH, SD, SH);

  // Gate arch
  const gW=Math.floor(keepW*0.52), gH=Math.floor(gW*1.15);
  const gX=keepX+Math.floor((keepW-gW)/2);
  px(gX,groundY-gH,gW,gH,'#000000');
  const aR=Math.floor(gW/2), aCX=gX+aR, aCY=groundY-gH;
  for(let ay=-aR;ay<=0;ay++){
    const aw=Math.floor(Math.sqrt(Math.max(0,aR*aR-ay*ay))*2);
    px(aCX-aw/2,aCY+ay,aw,1,'#000000');
  }
  // Portcullis
  ctx.fillStyle='#00ffcc22';
  for(let b=0;b<3;b++) px(gX+3+b*Math.floor(gW/3),groundY-gH,2,gH,'#00ffcc22');
  for(let b=0;b<4;b++) px(gX,groundY-gH+b*Math.floor(gH/3),gW,1,'#00ffcc22');

  // Towers
  for(const [tx,side] of [[bx,1],[bx+w-twW,-1]]) {
    px(tx, twY, twW, twH, S1);
    drawBricks(tx, twY, twW, twH, SD, SH);
    px(tx, twY, 2, twH, SD); px(tx+twW-2, twY, 2, twH, SD);
    drawBattlements(tx, twY, twW, 3, S1, SH, SD);
    drawArrowSlit(tx+Math.floor(twW/2)-3, twY+Math.floor(twH*0.28), 6, 14, winC);
    drawPyramidRoof(tx, twY, twW, 16, SD, S2);
  }

  // Main keep
  px(keepX, keepY, keepW, keepH, S2);
  drawBricks(keepX, keepY, keepW, keepH, SD, SH);
  px(keepX, keepY, 2, keepH, SD); px(keepX+keepW-2, keepY, 2, keepH, SD);
  drawBattlements(keepX, keepY, keepW, 4, S2, SH, SD);
  drawWindow(keepX+Math.floor(keepW/2)-7, keepY+Math.floor(keepH*0.25), 14, 18, winC, SD);
  drawWindow(keepX+Math.floor(keepW/2)-7, keepY+Math.floor(keepH*0.55), 14, 18, winC, SD);
  drawPyramidRoof(keepX, keepY, keepW, 24, SD, S2);
  drawFlag(keepX+Math.floor(keepW/2)-1, keepY-24, flagC, frame);

  // Wall battlements
  drawBattlements(bx+twW, wallY, w-twW*2, 4, S2, SH, SD);

  // Neon cyan trim glow on top edges
  ctx.fillStyle='#00ffcc44';
  px(keepX, keepY, keepW, 2, '#00ffcc44');
  px(bx, twY, twW, 2, '#00ffcc44');
  px(bx+w-twW, twY, twW, 2, '#00ffcc44');
}

function drawBricks(x, y, w, h, sd, sh) {
  for(let row=0; row*8<h; row++){
    const xoff=(row%2)*10;
    for(let col=-1;col<w/20+1;col++){
      const bx2=x+col*20+xoff;
      if(bx2>x-2&&bx2<x+w) px(bx2,y+row*8,1,8,sd);
    }
    px(x,y+row*8,w,1,sd);
    if(row%4===2) px(x,y+row*8,w,1,sh);
  }
}
function drawBattlements(x,y,w,count,wallC,merC,sd){
  const mW=Math.floor(w/count);
  for(let i=0;i<count;i++){
    if(i%2===0){
      px(x+i*mW,y-12,mW-2,12,merC);
      px(x+i*mW,y-12,1,12,sd);
      px(x+i*mW+mW-3,y-12,1,12,sd);
      px(x+i*mW,y-12,mW-2,1,sd);
    }
  }
}
function drawArrowSlit(x,y,w,h,lightC){
  px(x-1,y-1,w+2,h+1,'#000000'); px(x,y,w,h,lightC);
}
function drawWindow(x,y,w,h,lightC,sd){
  px(x-2,y-2,w+4,h+4,sd); px(x,y,w,h,lightC);

const smokeParticles=[];
function spawnSmoke(cx,cy){
  for(let i=0;i<26;i++) smokeParticles.push({
    x:cx+(Math.random()-0.5)*32, y:cy+(Math.random()-0.5)*22,
    vx:(Math.random()-0.5)*2.8, vy:-(Math.random()*1.8+0.4),
    r:10+Math.random()*16, life:1.0, decay:0.016+Math.random()*0.012,
    gray:(80+Math.random()*70)|0
  });
}
function updateSmoke(){
  for(let i=smokeParticles.length-1;i>=0;i--){
    const p=smokeParticles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.r+=0.25; p.life-=p.decay;
    if(p.life<=0) smokeParticles.splice(i,1);
  }
}
function drawSmoke(){
  for(const p of smokeParticles){
    ctx.globalAlpha=p.life*0.65;
    ctx.fillStyle=`rgb(${p.gray},${p.gray},${p.gray})`;
    const s=p.r|0;
    for(let dy=-s;dy<s;dy+=4){
      const rw=Math.floor(Math.sqrt(Math.max(0,s*s-dy*dy))*2);
      ctx.fillRect((p.x-rw/2)|0,(p.y+dy)|0,rw,4);
    }
  }
  ctx.globalAlpha=1;
}

// ── FIREBALLS ─────────────────────────────────────────────────────────────────
const fireballs=[];
function spawnFireballs(){
  const e=enemy; if(!e||!e.alive) return;
  const cfg=e.cfg;
  const ex=e.x+e.w/2, ey=e.y+e.h*0.4;
  const tx=wizard.x+wizard.w/2, ty=wizard.y+wizard.h*0.5;
  const dx=tx-ex, dy=ty-ey;
  const dist=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=dx/dist, ny=dy/dist;
  const count=cfg.fireCount;
  // Fan spread angles: 0 for 1 shot, ±15° for 2, -15/0/+15 for 3
  const angles = count===1?[0] : count===2?[-0.26,0.26] : [-0.28,0,0.28];
  for(const a of angles){
    const cos=Math.cos(a), sin=Math.sin(a);
    const vx=(nx*cos-ny*sin)*cfg.fireSpeed;
    const vy=(nx*sin+ny*cos)*cfg.fireSpeed;
    fireballs.push({x:ex,y:ey,vx,vy,life:160,color:e.disease.bodyColor,trail:[]});
  }
}
function updateFireballs(){
  for(let i=fireballs.length-1;i>=0;i--){
    const f=fireballs[i];
    f.trail.push({x:f.x,y:f.y});
    if(f.trail.length>8) f.trail.shift();
    f.x+=f.vx; f.y+=f.vy; f.life--;
    // Bounce off ground (for feel)
    if(f.y>GROUND_Y-8){ f.y=GROUND_Y-8; f.vy*=-0.55; f.vx*=0.85; }
    if(f.life<=0||f.x<-20||f.x>W+20){fireballs.splice(i,1);continue;}
    // Hit wizard
    if(wizard.invincible===0){
      if(f.x>wizard.x&&f.x<wizard.x+wizard.w&&f.y>wizard.y&&f.y<wizard.y+wizard.h){
        wizardHP--;wizard.invincible=90;updateHUD();
        fireballs.splice(i,1);
        if(wizardHP<=0){state='gameover';}
      }
    }
  }
}
function drawFireballs(){
  for(const f of fireballs){
    // Trail
    for(let t=0;t<f.trail.length;t++){
      const a=t/f.trail.length*0.5;
      ctx.globalAlpha=a;
      ctx.fillStyle='#ff6600';
      ctx.fillRect((f.trail[t].x-4)|0,(f.trail[t].y-4)|0,8,8);
    }
    ctx.globalAlpha=1;
    // Fireball body — layered pixel circles
    px(f.x-10,f.y-6, 20,12,'#cc2200'); // outer red
    px(f.x-8, f.y-8, 16,16,'#ff4400'); // main orange
    px(f.x-6, f.y-6, 12,12,'#ff8800'); // inner orange
    px(f.x-4, f.y-4,  8, 8,'#ffcc00'); // yellow core
    px(f.x-2, f.y-2,  4, 4,'#ffffff'); // white hot center
    // Flicker sparks
    if(Math.floor(frame/3)%2===0){
      px(f.x-12,f.y-2,4,4,'#ff6600');
      px(f.x+8, f.y-4,4,4,'#ff8800');
      px(f.x-2, f.y-10,4,4,'#ffaa00');
    }
  }
}

// ── SHOCKWAVES ────────────────────────────────────────────────────────────────
const shockwaves=[];
function spawnShockwave(){
  if(!enemy||!enemy.alive) return;
  // Two waves — one left, one right
  shockwaves.push({x:enemy.x, vx:-5, life:1.0});
  shockwaves.push({x:enemy.x+enemy.w, vx:5, life:1.0});
}
function updateShockwaves(){
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i];
    s.x+=s.vx; s.life-=0.018;
    if(s.life<=0||s.x<-30||s.x>W+30){shockwaves.splice(i,1);continue;}
    // Hit wizard if they're on the ground
    if(wizard.invincible===0&&wizard.onGround){
      if(Math.abs(s.x-wizard.x-wizard.w/2)<28){
        wizardHP--;wizard.invincible=90;updateHUD();
        shockwaves.splice(i,1);
        if(wizardHP<=0) state='gameover';
      }
    }
  }
}
function drawShockwaves(){
  for(const s of shockwaves){
    const h=24+Math.sin(frame*0.3)*6;
    ctx.globalAlpha=s.life;
    // Outer glow
    ctx.fillStyle='#ff440033';
    ctx.fillRect((s.x-18)|0,(GROUND_Y-h-8)|0,36,h+8);
    // Pixel wave ring
    px(s.x-14, GROUND_Y-h,    28, 4,'#ff6600');
    px(s.x-10, GROUND_Y-h-6,  20, 4,'#ffaa00');
    px(s.x-6,  GROUND_Y-h-12, 12, 4,'#ffee00');
    px(s.x-2,  GROUND_Y-h-18,  4, 4,'#ffffff');
    // Ground crack mark
    px(s.x-12, GROUND_Y, 24, 4,'#ff440055');
    ctx.globalAlpha=1;
  }
}

// ── ENEMY BEHAVIOUR (fire, charge, shockwave) ─────────────────────────────────
function updateEnemyBehavior(){
  const e=enemy; if(!e||!e.alive) return;
  const cfg=e.cfg;

  // ── Charge attack ──
  if(cfg.hasCharge){
    if(e.charging){
      e.x+=e.chargeVx;
      // End charge when hitting bounds
      if(e.x<20||e.x+e.w>W-20){
        e.charging=false; e.chargeCooldown=cfg.chargeCooldown;
        e.walkDir=e.x<W/2?1:-1;
      }
    } else {
      if(e.chargeWarning>0){
        e.chargeWarning--;
        if(e.chargeWarning===0){
          // Launch charge toward wizard
          e.charging=true;
          e.chargeVx=wizard.x<e.x?-9:9;
        }
      } else if(e.chargeCooldown>0){
        e.chargeCooldown--;
      } else {
        // Begin charge warning
        e.chargeWarning=50;
      }
    }
  }

  // ── Normal walk (when not charging) ──
  if(!e.charging){
    e.x+=e.walkDir*e.speed;
    if(e.x<W*0.44) e.walkDir=1;
    if(e.x+e.w>W-16) e.walkDir=-1;
  }

  // ── Fireballs ──
  if(cfg.fireCooldown>0){
    e.fireTimer--;
    if(e.fireTimer<=0){
      spawnFireballs();
      e.fireTimer=cfg.fireCooldown;
    }
  }

  // ── Shockwave stomp ──
  if(cfg.hasShock){
    e.shockTimer--;
    if(e.shockTimer<=0){
      spawnShockwave();
      e.shockTimer=cfg.shockCooldown;
    }
  }
}

// ── ZAP BOLTS ─────────────────────────────────────────────────────────────────
const zapBolts=[];
function fireZap(){
  if(wizard.zapCooldown>0) return;
  wizard.zapCooldown=22;
  const sx=wizard.facing===1?wizard.x+wizard.w+8:wizard.x-8;
  zapBolts.push({x:sx,y:wizard.y+22,vx:wizard.facing*10,life:38,segs:[]});
}
function updateZapBolts(){
  for(let i=zapBolts.length-1;i>=0;i--){
    const b=zapBolts[i];
    b.x+=b.vx; b.life--;
    if(b.life<=0||b.x<-20||b.x>W+20){zapBolts.splice(i,1);continue;}
    b.segs=[];
    let cx=b.x-b.vx*3,cy=b.y;
    for(let s=0;s<7;s++){cx+=b.vx*0.45+(Math.random()-0.5)*10;cy+=(Math.random()-0.5)*8;b.segs.push([cx|0,cy|0]);}
    if(enemy&&enemy.alive&&!enemy.flashTimer){
      const fy=Math.round(Math.sin(frame*0.045+enemy.floatT)*5);
      if(b.x>enemy.x&&b.x<enemy.x+enemy.w&&b.y>enemy.y+fy&&b.y<enemy.y+fy+enemy.h){
        enemy.hp--;enemy.flashTimer=10;score+=50;updateHUD();
        zapBolts.splice(i,1);
        if(enemy.hp<=0){
          enemy.alive=false;state='enemySmoke';sceneTimer=0;
          spawnSmoke(enemy.x+enemy.w/2,enemy.y+enemy.h/2);
        }
      }
    }
  }
}
function drawZapBolts(){
  for(const b of zapBolts){
    ctx.shadowBlur=12; ctx.shadowColor='#ffee44';
    ctx.strokeStyle='#ffee44';ctx.lineWidth=4;ctx.lineCap='square';
    ctx.beginPath();ctx.moveTo(b.x-b.vx*3,b.y);
    for(const[sx,sy]of b.segs)ctx.lineTo(sx,sy);
    ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(b.x-b.vx*3,b.y);
    for(const[sx,sy]of b.segs)ctx.lineTo(sx,sy);
    ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.shadowBlur=0;
    px(b.x-4,b.y-4,8,8,'#ffee44');px(b.x-2,b.y-2,4,4,'#ffffff');
  }
}

// ── POPUP ─────────────────────────────────────────────────────────────────────
function showPopup(){
  if(state!=='heartReveal'&&state!=='playing') return;
  const d=enemy.disease;
  document.getElementById('popupTitle').textContent=d.name;
  document.getElementById('popupIntro').textContent=d.intro;
  document.getElementById('popupDesc').textContent=d.desc;
  document.getElementById('popupCite').innerHTML=
    `Source: ${d.cite}<br><a href="${d.link}" target="_blank" rel="noopener noreferrer">${d.link}</a>`;
  score+=200; updateHUD();
  document.getElementById('popup').classList.add('show');
}
function continueAfterPopup(){
  document.getElementById('popup').classList.remove('show');
  healthyHeart=null;fireballs.length=0;shockwaves.length=0;
  if(level>=DISEASES.length) state='win';
  else{level++;updateHUD();spawnEnemy(level);state='playing';frame=0;}
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('hudLevel').textContent=`LVL ${level}`;
  document.getElementById('hudScore').textContent=`SCORE: ${score}`;
  document.getElementById('hudHP').textContent='❤'.repeat(wizardHP)+'♡'.repeat(Math.max(0,3-wizardHP));
}

// ── GAME LOGIC ────────────────────────────────────────────────────────────────
function startGame(){
  state='playing';level=1;score=0;wizardHP=3;
  wizard.x=100;wizard.y=GROUND_Y-wizard.h;wizard.vx=0;wizard.vy=0;
  zapBolts.length=0;fireballs.length=0;shockwaves.length=0;smokeParticles.length=0;healthyHeart=null;
  document.getElementById('topBar').classList.add('visible');
  updateHUD();spawnEnemy(1);frame=0;
}
function updateWizard(){
  const w=wizard;
  if(keys.left){w.vx=-3.2;w.facing=-1;}
  else if(keys.right){w.vx=3.2;w.facing=1;}
  else w.vx*=0.78;
  if(keys.jump&&w.onGround){w.vy=-11;w.onGround=false;}
  w.vy+=0.52;
  w.x=Math.round(w.x+w.vx);w.y=Math.round(w.y+w.vy);
  if(w.x<0)w.x=0;if(w.x+w.w>W)w.x=W-w.w;
  if(w.y+w.h>=GROUND_Y){w.y=GROUND_Y-w.h;w.vy=0;w.onGround=true;}else w.onGround=false;
  if(Math.abs(w.vx)>0.5&&w.onGround)w.walkFrame++;
  if(w.zapCooldown>0)w.zapCooldown--;
  if(w.invincible>0)w.invincible--;
  if(zapPressed){fireZap();zapPressed=false;}
  if(enemy&&enemy.alive&&w.invincible===0){
    const fy=Math.round(Math.sin(frame*0.045+enemy.floatT)*5);
    if(w.x<enemy.x+enemy.w&&w.x+w.w>enemy.x&&w.y<enemy.y+fy+enemy.h&&w.y+w.h>enemy.y+fy){
      wizardHP--;w.invincible=90;updateHUD();
      if(wizardHP<=0)state='gameover';
    }
  }
}

// ── TITLE SCREEN ──────────────────────────────────────────────────────────────
function drawTitle(){
  drawBg();
  // Dark panel with neon border
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(120,88,W-240,270);
  ctx.strokeStyle='#00ffcc';ctx.lineWidth=3;
  ctx.shadowBlur=20;ctx.shadowColor='#00ffcc';
  ctx.strokeRect(120,88,W-240,270);ctx.shadowBlur=0;
  ctx.strokeStyle='#00ffcc44';ctx.lineWidth=1;
  ctx.strokeRect(126,94,W-252,258);

  ctx.textAlign='center';
  ctx.shadowBlur=20;ctx.shadowColor='#00ffcc';
  ctx.fillStyle='#00ffcc';ctx.font='bold 46px Courier New';
  ctx.fillText('HEART',W/2,152);
  ctx.fillText('QUEST',W/2,206);
  ctx.shadowBlur=0;

  // Pixel heart
  const hx=W/2, hy=244;
  ctx.shadowBlur=12;ctx.shadowColor='#ff4488';
  px(hx-12,hy-8,10,8,'#ff4488');px(hx+2,hy-8,10,8,'#ff4488');
  px(hx-14,hy,20,8,'#ff4488');px(hx-12,hy+8,16,8,'#ff4488');
  px(hx-8,hy+16,8,6,'#ff4488');px(hx-4,hy+22,4,4,'#ff4488');
  ctx.shadowBlur=0;

  // Pulsing play button
  const pulse=Math.floor(frame/22)%2===0;
  ctx.fillStyle=pulse?'#00ffcc':'#008866';
  ctx.shadowBlur=pulse?20:0;ctx.shadowColor='#00ffcc';
  ctx.fillRect(W/2-72,278,144,44);ctx.shadowBlur=0;
  ctx.fillStyle=pulse?'#000':'#aaffee';
  ctx.font='bold 16px Courier New';ctx.fillText('> PLAY <',W/2,306);

  ctx.fillStyle='#335544';ctx.font='10px Courier New';
  ctx.fillText('ARROWS: MOVE  |  SPACE / TAP: ZAP',W/2,370);
}

function drawDifficultyHint(){
  // Small ability tags shown at top of enemy area on level start
  if(frame>200||!enemy||!enemy.alive) return;
  const tags=[];
  const cfg=enemy.cfg;
  if(cfg.fireCount>0) tags.push(`⚡ FIREBALLS x${cfg.fireCount}`);
  if(cfg.hasCharge)   tags.push('💨 CHARGE DASH');
  if(cfg.hasShock)    tags.push('🌊 SHOCKWAVE');
  if(tags.length===0) return;
  const alpha=frame<160?1:1-(frame-160)/40;
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(W/2-130,6,260,14+tags.length*16);
  ctx.fillStyle='#ffcc00'; ctx.font='bold 10px Courier New'; ctx.textAlign='center';
  ctx.fillText('NEW ABILITIES:',W/2,18);
  ctx.fillStyle='#ff8844';
  for(let i=0;i<tags.length;i++) ctx.fillText(tags[i],W/2,34+i*16);
  ctx.globalAlpha=1;
}

function drawLevelBanner(){
  if(frame>110)return;
  const a=frame<80?1:1-(frame-80)/30;
  ctx.globalAlpha=a;
  ctx.fillStyle='#000000cc';ctx.fillRect(W/2-110,H/2-24,220,48);
  ctx.strokeStyle='#00ffcc';ctx.lineWidth=2;
  ctx.shadowBlur=10;ctx.shadowColor='#00ffcc';
  ctx.strokeRect(W/2-110,H/2-24,220,48);ctx.shadowBlur=0;
  ctx.fillStyle='#00ffcc';ctx.font='bold 22px Courier New';ctx.textAlign='center';
  ctx.shadowBlur=8;ctx.shadowColor='#00ffcc';
  ctx.fillText(`LEVEL ${level}`,W/2,H/2+8);
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

function drawEndScreen(title,color){
  drawBg();
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowBlur=25;ctx.shadowColor=color;
  ctx.fillStyle=color;ctx.font='bold 48px Courier New';
  ctx.fillText(title,W/2,H/2-40);ctx.shadowBlur=0;
  ctx.fillStyle='#00ffcc';ctx.font='18px Courier New';
  ctx.fillText(`SCORE: ${score}`,W/2,H/2+10);
  ctx.fillStyle='#335544';ctx.font='12px Courier New';
  ctx.fillText('CLICK OR TAP TO PLAY AGAIN',W/2,H/2+52);
  canvas.onclick=()=>{canvas.onclick=null;startGame();};
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function loop(){
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,W,H);
  frame++;sceneTimer++;

  if(state==='title'){
    drawTitle();
  } else if(state==='playing'){
    updateWizard();updateEnemyBehavior();updateZapBolts();updateFireballs();updateShockwaves();
    drawBg();
    drawShockwaves();
    if(enemy)drawEnemy();
    drawFireballs();
    drawWizard();drawZapBolts();drawLevelBanner();
    drawDifficultyHint();
  } else if(state==='enemySmoke'){
    updateSmoke();
    drawBg();drawWizard();drawSmoke();
    if(smokeParticles.length===0||sceneTimer>80){
      state='heartReveal';sceneTimer=0;
      const cx=Math.min(Math.max((enemy.x+enemy.w/2)|0,120),W-120);
      spawnHealthyHeart(cx,GROUND_Y-90);
    }
  } else if(state==='heartReveal'){
    updateHealthyHeart();
    drawBg();drawWizard();drawHealthyHeart(healthyHeart);
    if(sceneTimer>85&&healthyHeart?.settled){
      state='playing'; // don't block — show popup
      showPopup();
    }
  } else if(state==='gameover'){
    drawEndScreen('GAME OVER','#ff2222');
  } else if(state==='win'){
    drawEndScreen('YOU WIN!','#00ffcc');
  }

  requestAnimationFrame(loop);
}

// ── RESIZE ────────────────────────────────────────────────────────────────────
function resize(){
  document.getElementById('gameWrapper').style.width=Math.min(window.innerWidth,800)+'px';
}
window.addEventListener('resize',resize);resize();
loop();
</script>
